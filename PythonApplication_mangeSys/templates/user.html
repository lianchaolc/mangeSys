{% extends "layout.html" %}
{% block content %}
<div class="layui-container" style="margin-top: 20px;">
    <div class="layui-card">
       <div class="layui-card-header" style="font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;">
    <span>用户管理</span>
    <button class="layui-btn layui-btn-sm layui-btn-normal" id="addUserBtn">
        <i class="layui-icon layui-icon‑add"></i> 新增用户
    </button>
</div>
        <div class="layui-card-body">
            <!-- 搜索区域 -->
            <div class="layui-form layui-row" style="margin-bottom:18px;">
                <div class="layui-col-md5">
                    <input type="text" name="keyword" id="keyword" placeholder="请输入用户名搜索" class="layui-input">
                </div>
                <div class="layui-col-md3">
                <input type="text" name="start_time" id="start_time" class="layui-input" placeholder="创建开始时间">
                 </div>
                <div class="layui-col-md3">
                 <input type="text" name="end_time" id="end_time" class="layui-input" placeholder="创建结束时间">
                  </div>
                <div class="layui-col-md3" style="padding-left:12px;">
                    <button class="layui-btn layui-btn-normal" id="searchBtn">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                </div>
            </div>
            <!-- 表格 -->
            <table id="userTable" lay-filter="userTable"></table>
            <select id="myPageSize">
  <option value="10">10条/页</option>
  <option value="20">20条/页</option>
  <option value="50">50条/页</option>
  <option value="100">100条/页</option>
</select>
        </div>
    </div>
</div>

<!-- 行内工具栏模板 -->
<script type="text/html" id="toolBar">
  <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="edit">编辑</button>
  <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
</script>

<!-- 编辑弹窗模板，后续编辑功能使用 -->
<!-- 编辑弹窗模板，后续编辑功能使用 -->
<script type="text/html" id="editTpl">
<div class="layui-form" lay-filter="editForm" style="padding:20px 10px;">
    <input type="hidden" name="id">
    <div class="layui-form-item">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-block">
            <input type="text" name="username" class="layui-input" placeholder="请输入用户名">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
            <input type="password" name="password" class="layui-input" placeholder="请输入密码">
        </div>
    </div>
   <!-- 角色下拉框 -->
        <div class="layui-form-item">
            <label class="layui-form-label">用户角色</label>
            <div class="layui-input-block">
                <select name="role" lay-verify="required">
                    <option value="">请选择角色</option>
                    <option value="admin">系统管理员</option>
                    <option value="manager">调度管理员</option>
                    <option value="escort">押运人员</option>
                    <option value="warehouse">库管人员</option>
                    <!-- 如果你的系统不需要这么多角色，删掉对应选项即可 -->
                </select>
            </div>
        </div>

    <div class="layui-form-item">
        <label class="layui-form-label">手机号</label>
        <div class="layui-input-block">
            <input type="text" name="phone" class="layui-input" placeholder="请输入手机号">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="radio" name="status" value="1" title="启用" checked>
            <input type="radio" name="status" value="0" title="禁用">
        </div>
    </div>
</div>
</script>


<script>
// 只保留 1 个顶层 layui.use，一次性加载全部模块
layui.use(['table','jquery','form','laydate','layer'], function(){
    var table = layui.table;
    var $ = layui.jquery;
    var form = layui.form;
    var laydate = layui.laydate;
    var layer = layui.layer;

    // 时间选择器，保存实例对象，用于clear清空
    var startDateIns = laydate.render({
        elem: '#start_time',
        type: 'datetime',
        format: 'yyyy-MM-dd HH:mm:ss',
        done:function(val){
            endDateIns.config.min = val;
        }
    })
    var endDateIns = laydate.render({
        elem: '#end_time',
        type: 'datetime',
        format: 'yyyy-MM-dd HH:mm:ss',
        done:function(val){
            startDateIns.config.max = val;
        }
    })

    //表格渲染
    var tableIns = table.render({
        elem: '#userTable',
        url: '/api/user/list',
        id: 'userTableId',
        method: 'get',
        page: true,
        limit:10,
        limits:[10,20,50,100],
        where: {
            keyword: "",
            start_time:"",
            end_time:""
        },
        cols: [[
            {field:'id', title:'ID', width:100, align:'center'},
            {field:'username', title:'用户名', align:'center'},
            {field:'role_names', title:'角色权限', align:'center'},
            {field:'create_time', title:'创建时间', align:'center'},
            {title:'操作', width:180, align:'center', toolbar:'#toolBar'}
        ]]
    });

    //切换每页条数
    $('#myPageSize').on('change', function(){
        let pageSize = parseInt($(this).val());
        table.reload('userTableId', {
            page: {
                curr: 1,
                limit: pageSize
            }
        });
    });

    //搜索
    $('#searchBtn').click(function(){
        var keyword = $('#keyword').val();
        var st = $('#start_time').val();
        var et = $('#end_time').val();
        tableIns.reload({
            where: {
                keyword: keyword,
                start_time: st,
                end_time: et
            },
            page: { curr:1 }
        })
    })

    //重置按钮，使用实例对象清空日历
    $('#resetBtn').click(function(){
        $('#keyword').val("");
        startDateIns.setValue('');
        endDateIns.setValue('');
        tableIns.reload({
            where: { keyword: "",start_time:"",end_time:"" },
            page: { curr:1 }
        })
    })

    //监听表格编辑删除按钮
    table.on('tool(userTable)', function(obj){
        var row = obj.data;
        if(obj.event === 'edit'){
            layer.open({
                type:1,
                title:"编辑用户",
                area:["520px","360px"],
                content:$("#editTpl").html(),
                success:function(layero, index){
                    form.val('editForm', row);
                }
            })
        }else if(obj.event === 'del'){
            layer.confirm('确定删除【'+row.username+'】？', function(index){
                layer.msg("删除逻辑待开发");
                layer.close(index);
            });
        }
    })

    //新增按钮
    $('#addUserBtn').click(function(){
        layer.msg("新增用户待开发");
        layer.open({
        type:1, // 1=页面层，内容为 DOM/HTML 片段
        title:"新增用户",
        area:["520px","360px"] ,//弹层宽、高；高度建议略大以容纳校验提示
        content: $('#editTpl').html(), // 把模板 HTML 作为字符串插入弹层（注意：等于新建 DOM）
       // success 在弹层创建完成、DOM 插入后执行，是初始化数据/组件的时机
        
       success:function(layero,index){
       form.val('editForm',{
       id:"",
       username:"",
       password:"",
       role:"",
       phone:""
       
       });
        // 2) 关键步骤：动态插入的内容必须重新渲染表单组件
            //    否则 select 等组件会显示异常、form.val 取值也可能不准
            //    第二个参数 'editForm' 即 form 的 lay-filter，做到只渲染当前表单

        form.render(null,'editForm')    ;
          console.log("新增提交数据1"); // 调试用，上线可删
        },
       
          btn: ['保存', '取消'],
        // 弹层底部按钮：索引 0 对应 yes 回调，索引 1 对应 no 回调
         // 点击"保存"时触发；index 为当前弹层索引，layero 为弹层 DOM 对象
        yes: function (index, layero) {
              // 1) 取出表单全部数据（键名 = 模板中各 input 的 name）
            let submitData = form.val('editForm');
            console.log("新增提交数据：", submitData); // 调试用，上线可删

            // 2) 兜底校验：防止模板漏配 lay-verify 时提交空数据
            if (!submitData.username) {
                return layer.msg('用户名不能为空', { icon: 2 });
            }
            if (!submitData.password) {           // 新增场景密码必填
                return layer.msg('密码不能为空', { icon: 2 });
            }

            // 3) 防重复提交：请求期间显示 loading 遮罩，避免用户连点造成重复新增
            let loading = layer.load(2);

            // 4) 提交到后端新增接口，指定 dataType 为 json
            $.post("/api/user/add", submitData, function (res) {
                layer.close(loading);             // 请求返回后关闭 loading

                if (res.code === 0) {             // 后端约定 code===0 表示成功
                    layer.msg("新增成功");
                    layer.close(index);           // 关闭当前弹层
                    tableIns.reload();            // 重载表格，刷新列表数据
                } else {
                    // 业务失败：展示后端返回的错误信息，弹层保持打开便于修改
                    layer.msg(res.msg, { icon: 2 });
                }
            }, 'json').fail(function () {
                // 网络层异常（超时、断网、5xx 未按 json 返回等）
                layer.close(loading);
                layer.msg("网络请求异常", { icon: 2 });
            });

            // 5) return false 的真实作用：阻止弹层"自动关闭"
            //    这样请求失败时弹层仍在，用户可继续改；与"阻止表单提交"无关
            return false;
        }

        // 如需点击"取消"时额外处理，可补充 no: function(index, layero){ layer.close(index); }
    });

       


    })
})
</script>



{% endblock %}
