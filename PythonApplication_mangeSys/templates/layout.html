<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现金押运管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        html,body{height:100%;margin:0;}
        .layui-layout-body{height:100%;}
        .layui-side{width:220px;}
    </style>
</head>
<body class="layui-layout-body layui-layout-fluid">
<div class="layui-layout">
    <div class="layui-layout-header layui-bg-blue">
        <ul class="layui-nav layui-layout-header-nav">
            <li class="layui-this"><a href="/dashboard">首页看板</a></li>
            <li><a href="/customer">客户库存管理</a></li>
            <li><a href="#">款箱管理</a></li>
            <li><a href="#">押运管理</a></li>
            <li style="float:right;"><a href="#">管理员｜退出</a></li>
        </ul>
    </div>
    <div class="layui-layout-body">
        <div class="layui-side layui-bg-black">
            <ul class="layui-nav layui-nav-tree" lay-filter="leftMenu">
                <li class="layui-nav-item layui-this">
                    <a href="/dashboard"><i class="layui-icon layui-icon-home"></i> <cite>工作台</cite></a>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;"><i class="layui-icon layui-icon-user"></i> <cite>系统管理</cite></a>
                    <dl class="layui-nav-child">
                        <dd><a href="#">押运人员管理</a></dd>
                        <dd><a href="#">网点机构管理</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;"><i class="layui-icon layui-icon-file"></i> <cite>库存业务</cite></a>
                    <dl class="layui-nav-child">
                        <dd><a href="/customer">抵质押品库存</a></dd>
                        <dd><a href="#">款箱出入库</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
        <div class="layui-layout-main">
            <div class="layui-body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</div>
<script>
layui.use('element', function(){
    var element = layui.element;
});
</script>
</body>
</html>
