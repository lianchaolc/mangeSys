<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现金押运管理系统</title>
    <!-- layui 2.8.18 CSS样式CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <!-- layui JS脚本CDN -->
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <!-- Echarts图表库，首页看板图表使用 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* html body占满浏览器可视高度，清除内外边距 */
        html,body{
            height:100%;
            margin:0;
            padding:0;
        }
        /* layui布局容器高度铺满全屏 */
        .layui-layout-body{
            height:100%;
        }
        /* 自定义侧边栏宽度220px */
        .layui-side{
            width:220px;
        }
        /* 顶部页面标题样式 */
        .top-page-title{
            color:#ffffff;
            line-height: 60px;
            font-size:16px;
            padding: 0 20px;
        }
    </style>
</head>
<!-- layui布局body基础class -->
<body class="layui-layout-body">
<!--
    layui官方标准后台布局容器 layui-layout-admin
    ⚠重要：直接子元素只能是 layui-header(头部)、layui-side(侧边栏)、layui-body(主内容)
    禁止嵌套多余div，否则高度、定位错乱
-->
<div class="layui-layout-admin">
<!-- ==========顶部头部区域 layui-header，蓝色背景 ========== -->
<div class="layui-header layui-bg-blue">
    <div class="top-page-title" id="topPageTitle">首页看板</div>

    <!-- 顶部水平导航菜单【↓修改】全部a标签增加 data-group 分组标识 -->
    <ul class="layui-nav layui-layout-left" lay-filter="topNav">
        <li class="layui-nav-item"><a href="/dashboard" data-page-title="首页看板" data-group="workbench">首页看板</a></li>
        <li class="layui-nav-item"><a href="/customer" data-page-title="客户库存管理" data-group="customer">客户库存管理</a></li>
        <li class="layui-nav-item"><a href="#" data-page-title="款箱管理" data-group="box">款箱管理</a></li>
        <li class="layui-nav-item"><a href="#" data-page-title="押运管理" data-group="escort">押运管理</a></li>
    </ul>

    <ul class="layui-nav layui-layout-right" lay-filter="topRightNav">
        <li class="layui-nav-item">
            <a href="javascript:void(0);" onclick="loginout()">{{session.username}}｜退出</a>
        </li>
    </ul>
</div>

<!-- 左侧侧边栏【↓修改】外层li增加 class="left-menu-item" + data-group 分组标识，和顶部导航一一对应 -->
<div class="layui-side layui-bg-black">
    <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree" lay-filter="leftMenu">
            <!-- 工作台分组 -->
            <li class="layui-nav-item left-menu-item" data-group="workbench">
                <a href="/dashboard" data-page-title="工作台">工作台</a>
            </li>
            <!-- 客户相关分组 -->
            <li class="layui-nav-item left-menu-item" data-group="customer">
                <a href="javascript:;">系统管理</a>
                <dl class="layui-nav-child">
                    <dd><a href="/api/user/page" data-page-title="用户管理">用户管理</a></dd>
                    <dd><a href="/netpoint" data-page-title="网点机构管理">网点机构管理</a></dd>
                    <dd><a href="/customer" data-page-title="客户管理">客户管理</a></dd>
                </dl>
            </li>
            <!-- 款箱管理分组 -->
            <li class="layui-nav-item left-menu-item" data-group="box">
                <a href="javascript:;">款箱相关菜单</a>
                <dl class="layui-nav-child">
                    <dd><a href="/xxx1" data-page-title="款箱登记">款箱登记</a></dd>
                    <dd><a href="/xxx2" data-page-title="款箱盘点">款箱盘点</a></dd>
                </dl>
            </li>
            <!-- 押运管理分组 -->
            <li class="layui-nav-item left-menu-item" data-group="escort">
                <a href="javascript:;">押运相关菜单</a>
                <dl class="layui-nav-child">
                    <dd><a href="/yy1" data-page-title="押运任务">押运任务</a></dd>
                    <dd><a href="/yy2" data-page-title="线路管理">线路管理</a></dd>
                </dl>
            </li>
        </ul>
    </div>
</div>

<!-- ==========主内容显示区域，子页面继承模板后填充block content ========== -->
<div class="layui-body">
    {% block content %}
    {% endblock %}
</div>

</div>

<script>
// layui模块加载：element处理导航菜单，jquery用于DOM操作
layui.use(['element', 'jquery'], function(){
    var element = layui.element;
    var $ = layui.jquery;
    //【✅修复：path变量提前定义，优先拿到当前路由】
    var path = window.location.pathname;

    //【↓新增】侧边菜单切换函数，控制分组显示隐藏
    function showLeftMenu(groupKey){
        // 先隐藏所有侧边分组菜单
        $('.left-menu-item').hide();
        // 展示当前选中分组的菜单
        $('.left-menu-item[data-group="'+groupKey+'"]').show();
        // 刷新layui导航渲染，下拉菜单样式正常生效
        element.render('nav','leftMenu');
    }

    // ====================== 1.左侧菜单自动高亮逻辑 ======================
    // 访问哪个页面，对应菜单激活高亮、展开父菜单
    var initGroup = 'workbench'; // 默认分组
    $(".layui-nav-tree a").each(function(){
        var href = $(this).attr("href");
        var pageTitle = $(this).data('page-title'); //读取data-page-title页面标题
        if(href === path){
            $(this).parent().addClass("layui-this");
            $(this).closest(".layui-nav-item").addClass("layui-nav-itemed");
            //【↓新增】路由匹配时，同步切换侧边分组
            initGroup = $(this).closest(".left-menu-item").data("group");
            // 更新顶部页面标题，解决顶部导航文字不正确
            $("#topPageTitle").text(pageTitle);
        }
    });
    //【✅修复：初始化使用匹配到的分组，而不是固定工作台】
    showLeftMenu(initGroup);

    // ====================== 2.顶部水平导航自动高亮 ======================
    $("[lay-filter='topNav'] .layui-nav-item").each(function(){
        var aDom = $(this).find('a');
        var aHref = aDom.attr("href");
        var pageTitle = aDom.data('page-title');
        if(aHref === path){
            $(this).addClass("layui-this");
            //【↓新增】路由匹配，拿到分组，同步侧边栏
            initGroup = aDom.data("group");
            showLeftMenu(initGroup);
            // 更新顶部页面标题
            $("#topPageTitle").text(pageTitle);
        }else{
            $(this).removeClass("layui-this");
        }
    })
    // 通知element组件刷新导航样式，让layui‑this高亮生效
    element.render('nav','topNav');

    // ====================== 3.监听左侧菜单点击事件，切换顶部标题 ======================
    // 点击左侧菜单，立刻更新顶部显示文字（无刷新场景生效）
    element.on('nav(leftMenu)',function(elem){
        var clickTitle = $(elem).data('page-title');
        if(clickTitle){
            $("#topPageTitle").text(clickTitle);
        }
    });

    // ====================== 4.监听顶部导航点击事件【↓修改】：增加侧边分组联动逻辑，保留原有标题修改 ======================
    element.on('nav(topNav)',function(elem){
        var clickTitle = $(elem).data('page-title');
        var group = $(elem).data('group');
        if(clickTitle){
            $("#topPageTitle").text(clickTitle);
        }
        // 联动侧边栏切换
        if(group){
            showLeftMenu(group);
            // 自动展开当前分组下拉菜单，不需要就注释掉这一行
            $('.left-menu-item[data-group="'+group+'"]').find('a').click();
        }
    });
});

/**
 * 用户退出登录函数
 * onclick="loginout()" 头部退出按钮调用
 * 请求后端退出接口 /api/auth/loginout
 * 返回code=200成功后跳转登录页面
 */
function loginout(){
    console.log("进入退出登录方法");
    fetch('/api/auth/loginout')
    .then(res=>res.json())
    .then(ret => {
        console.log("后端返回数据：", ret);
        console.log("返回的code：", ret.code);
        // 判断后端返回状态码，成功跳转登录页
        if (ret.code === 200) {
            console.log("【退出】满足条件，准备跳转！");
            location.href = "/api/auth/loginPage";
        }
    })
    // 请求异常捕获（网络错误、接口500等）
    .catch(err => {
        alert("请求失败，请重试");
        console.error(err);
    })
}
</script>
</body>
</html>
