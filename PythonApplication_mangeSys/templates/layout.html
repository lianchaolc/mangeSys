<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现金押运管理系统</title>
    <!-- layui 2.8.18 CSS样式CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <!-- layui JS脚本CDN -->
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <!-- Echarts图表库，首页看板图表使用 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* html body占满浏览器可视高度，清除内外边距 */
        html,body{
            height:100%;
            margin:0;
            padding:0;
        }
        /* layui布局容器高度铺满全屏 */
        .layui-layout-body{
            height:100%;
        }
        /* 自定义侧边栏宽度220px */
        .layui-side{
            width:220px;
        }
        /* 顶部页面标题样式 */
        .top-page-title{
            color:#ffffff;
            line-height: 60px;
            font-size:16px;
            padding: 0 20px;
        }
    </style>
</head>
<!-- layui布局body基础class -->
<body class="layui-layout-body">
<!--
    layui官方标准后台布局容器 layui-layout-admin
    ⚠重要：直接子元素只能是 layui-header(头部)、layui-side(侧边栏)、layui-body(主内容)
    禁止嵌套多余div，否则高度、定位错乱
-->
<div class="layui-layout-admin">
<!-- ==========顶部头部区域 layui-header，蓝色背景 ========== -->
<div class="layui-header layui-bg-blue">
    <!-- 【新增：顶部页面标题，解决导航文字显示不正确】 -->
    <div class="top-page-title" id="topPageTitle">首页看板</div>

    <!-- 顶部水平导航菜单 lay-filter="topNav"用于JS筛选导航组件 -->
    <ul class="layui-nav layui-layout-left" lay-filter="topNav">
        <!-- ⚠注意：layui水平导航li必须加上 class="layui-nav-item"，否则高亮layui‑this无效！！！ -->
        <li class="layui-nav-item"><a href="/dashboard" data-page-title="首页看板">首页看板</a></li>
        <li class="layui-nav-item"><a href="/customer" data-page-title="客户库存管理">客户库存管理</a></li>
        <li class="layui-nav-item"><a href="#" data-page-title="款箱管理">款箱管理</a></li>
        <li class="layui-nav-item"><a href="#" data-page-title="押运管理">押运管理</a></li>
    </ul>
    <!-- 右上角：用户信息+退出登录，必须加 layui‑nav‑item -->
    <ul class="layui-nav layui-layout-right" lay-filter="topRightNav">
        <li class="layui-nav-item">
            <a href="javascript:void(0);" onclick="loginout()">{{session.username}}｜退出</a>
        </li>
    </ul>
</div>

<!-- ==========左侧侧边栏区域 layui‑side ========== -->
<div class="layui-side layui-bg-black">
    <!-- layui-side-scroll：侧边栏内部滚动容器，菜单过多出现滚动条 -->
    <div class="layui-side-scroll">
        <!-- layui-nav-tree：树形侧边菜单，lay‑filter用于js筛选组件 -->
        <ul class="layui-nav layui-nav-tree" lay-filter="leftMenu">
            <li class="layui-nav-item">
                <a href="/dashboard" data-page-title="工作台">工作台</a>
            </li>
            <li class="layui-nav-item">
                <a href="javascript:;">系统管理</a>
                <!-- layui-nav‑child：子菜单下拉列表 -->
                <dl class="layui-nav-child">
                    <!-- data-page-title：保存本页要在顶部展示的标题文字 -->
                    <dd><a href="/api/user/page" data-page-title="用户管理">用户管理</a></dd>
                    <dd><a href="/org" data-page-title="网点机构管理">网点机构管理</a></dd>
                    <dd><a href="/customer" data-page-title="客户管理">客户管理</a></dd>
                </dl>
            </li>
        </ul>
    </div>
</div>

<!-- ==========主内容显示区域，子页面继承模板后填充block content ========== -->
<div class="layui-body">
    {% block content %}
    {% endblock %}
</div>

</div>

<script>
// layui模块加载：element处理导航菜单，jquery用于DOM操作
layui.use(['element', 'jquery'], function(){
    var element = layui.element;
    var $ = layui.jquery;
    // 获取当前浏览器访问路径
    var path = window.location.pathname;

    // ====================== 1.左侧菜单自动高亮逻辑 ======================
    // 访问哪个页面，对应菜单激活高亮、展开父菜单
    $(".layui-nav-tree a").each(function(){
        var href = $(this).attr("href");
        var pageTitle = $(this).data('page-title'); //读取data-page-title页面标题
        if(href === path){
            $(this).parent().addClass("layui-this");
            $(this).closest(".layui-nav-item").addClass("layui-nav-itemed");
            // 更新顶部页面标题，解决顶部导航文字不正确
            $("#topPageTitle").text(pageTitle);
        }
    });

    // ====================== 2.顶部水平导航自动高亮 ======================
    $("[lay-filter='topNav'] .layui-nav-item").each(function(){
        var aDom = $(this).find('a');
        var aHref = aDom.attr("href");
        var pageTitle = aDom.data('page-title');
        if(aHref === path){
            $(this).addClass("layui-this");
            // 更新顶部页面标题
            $("#topPageTitle").text(pageTitle);
        }else{
            $(this).removeClass("layui-this");
        }
    })
    // 通知element组件刷新导航样式，让layui‑this高亮生效
    element.render('nav','topNav');

    // ====================== 3.监听左侧菜单点击事件，切换顶部标题 ======================
    // 点击左侧菜单，立刻更新顶部显示文字（无刷新场景生效）
    element.on('nav(leftMenu)',function(elem){
        var clickTitle = $(elem).data('page-title');
        if(clickTitle){
            $("#topPageTitle").text(clickTitle);
        }
    });

    // ====================== 4.监听顶部导航点击事件，切换顶部标题 ======================
    element.on('nav(topNav)',function(elem){
        var clickTitle = $(elem).data('page-title');
        if(clickTitle){
            $("#topPageTitle").text(clickTitle);
        }
    });
});

/**
 * 用户退出登录函数
 * onclick="loginout()" 头部退出按钮调用
 * 请求后端退出接口 /api/auth/loginout
 * 返回code=200成功后跳转登录页面
 */
function loginout(){
    console.log("进入退出登录方法");
    fetch('/api/auth/loginout')
    .then(res=>res.json())
    .then(ret => {
        console.log("后端返回数据：", ret);
        console.log("返回的code：", ret.code);
        // 判断后端返回状态码，成功跳转登录页
        if (ret.code === 200) {
            console.log("【退出】满足条件，准备跳转！");
            location.href = "/api/auth/loginPage";
        }
    })
    // 请求异常捕获（网络错误、接口500等）
    .catch(err => {
        alert("请求失败，请重试");
        console.error(err);
    })
}
</script>
</body>
</html>
