<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现金押运管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        html,body{height:100%;margin:0;}
        .layui-layout-body{height:100%;}
        .layui-side{width:220px;}
        html,body{
    margin:0;
    padding:0;
}
.layui-layout-body{
    margin:0;
    padding:0;
}
.layui-layout-admin .layui-header{
    top:0 !important;
    margin-top:0 !important;
    padding-top:0 !important;
}
.layui-layout-header-nav{
    margin:0 !important;
    padding:0 !important;
}
    </style>
</head>
<body class="layui-layout-body layui-layout-fluid">
<div class="layui-layout">
    <div class="layui-layout-header layui-bg-blue">
        <ul class="layui-nav layui-layout-header-nav">
            <li class="layui-this"><a href="/dashboard">首页看板</a></li>
            <li><a href="/customer">客户库存管理</a></li>
            <li><a href="#">款箱管理</a></li>
            <li><a href="#">押运管理</a></li>
            <li style="float:right;"><a href="#">管理员｜退出</a></li>
        </ul>
    </div>
    <div class="layui-layout-body">
        <div class="layui-side layui-bg-black">
    <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree" lay-filter="leftMenu">
            <li class="layui-nav-item">
                <a href="/dashboard">工作台</a>
            </li>
            <li class="layui-nav-item">
                <a href="javascript:;">系统管理</a>
                <dl class="layui-nav-child">
                    <!-- 押运人员管理 -->
                    <dd>
                        <a href="/escort">押运人员管理</a>
                    </dd>
                    <!-- 网点机构管理 -->
                    <dd>
                        <a href="/org">网点机构管理</a>
                    </dd>
                    <!-- 你之前的客户管理也可以放这里 -->
                    <dd>
                        <a href="/customer">客户管理</a>
                    </dd>
                </dl>
            </li>
        </ul>
    </div>
</div>

        <div class="layui-layout-main">
            <div class="layui-body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</div>
<script>
layui.use(['element', 'jquery'], function(){
    var element = layui.element;
    var $ = layui.jquery;
    var path = window.location.pathname;
    $(".layui-nav-tree a").each(function(){
        var href = $(this).attr("href");
        if(href === path){
            $(this).parent().addClass("layui-this");
            $(this).closest(".layui-nav-item").addClass("layui-nav-itemed");
        }
    })
    // 重点：不要 element.render("nav")
})



</script>
</body>
</html>
